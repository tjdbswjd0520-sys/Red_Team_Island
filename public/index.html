    const state = {

    function getScenario() {
      return SCENARIOS.find(s => s.id === state.selectedScenarioId) || SCENARIOS[0];
    }

    function completedReportCount() {
      return Object.values(state.reportsByScenario).filter(r => r && r.isCorrect).length;
    }

    function verifiedPolicyCount() {
      return Object.values(state.defenseTestResultByScenario).filter(r => r && r.passed).length;
    }

    function isWorkshopUnlocked() {
      return completedReportCount() >= SCENARIOS.length;
    }

    function openPrologue() {
      state.showPrologue = true;
      state.prologueStep = 0;
      render();
    }

    function closePrologue() {
      state.showPrologue = false;
      render();
    }

    function nextPrologueStep() {
      if (state.prologueStep < PROLOGUE_SCENES.length - 1) {
        state.prologueStep += 1;
        render();
      } else {
        closePrologue();
      }
    }

    function prevPrologueStep() {
      if (state.prologueStep > 0) {
        state.prologueStep -= 1;
        render();
      }
    }

    function openEpilogue() {
      state.showEpilogue = true;
      state.epilogueStep = 0;
      render();
    }

    function closeEpilogue() {
      state.showEpilogue = false;
      state.showFinalEnding = true;
      render();
    }

    function nextEpilogueStep() {
      if (state.epilogueStep < EPILOGUE_SCENES.length - 1) {
        state.epilogueStep += 1;
        render();
      } else {
        closeEpilogue();
      }
    }

    function prevEpilogueStep() {
      if (state.epilogueStep > 0) {

        state.tutorialStep += 1;
        render();
      } else {
        closeTutorial();
      }
    }

    function prevTutorialStep() {
      if (state.tutorialStep > 0) {
        state.tutorialStep -= 1;
        render();
      }
    }

    function selectScenario(id) {
      state.selectedScenarioId = id;
      const sc = getScenario();
      state.promptInput = sc.defaultPrompt;
      const saved = state.reportsByScenario[id];
      state.reportDraft = saved
        ? JSON.parse(JSON.stringify(saved))
        : { slots: {}, verdict: "문제 있음", submitted: false, isCorrect: false, feedback: [] };
      render();
    }

    function navigate(nextView) {
      if (nextView === "defense" && !isWorkshopUnlocked()) {
        alert(`🔒 정비 작업장은 12개 공격 시나리오의 근거 보고서를 모두 완료해야 열립니다!
(현재 완료: ${completedReportCount()} / 12)`);
        return;
      }
      if (!state.requestAccepted && ["inspect", "lab", "archive", "report"].includes(nextView)) {
        state.requestAccepted = true;
      }
      state.view = nextView;
      render();
    }

    function loadDefaultPrompt() {
      state.promptInput = getScenario().defaultPrompt;
      render();
    }

    async function callAgentRunApi({ scenarioId, mode, prompt, activeBlocks }) {
      try {
        const res = await fetch("/api/agent/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            scenario_id: scenarioId,
            mode,
            prompt,
            active_blocks: activeBlocks || []
          })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } catch (err) {
        console.warn("API fallback:", err);
        return null;
      }
    }

    async function runAttackTest() {
      if (state.isRunningAgent) return;
      const sc = getScenario();
      state.isRunningAgent = true;
      render();

      const apiRes = await callAgentRunApi({
        scenarioId: sc.id,
        mode: "redteam",
        prompt: state.promptInput,
        activeBlocks: []
      });

      const isSafeScenario = sc.expectedVerdict === "문제 없음";
      const aiOutput = apiRes && apiRes.ai_output
        ? apiRes.ai_output
        : sc.unsafeOutput;
      const tools = apiRes && Array.isArray(apiRes.tools_called)
        ? apiRes.tools_called
        : sc.unsafeTools;
      const blocked = apiRes && typeof apiRes.blocked === "boolean"
        ? apiRes.blocked
        : isSafeScenario;

      const logItem = {
        id: "LOG-" + Math.floor(100 + Math.random() * 900),
        time: new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
        mode: "공격 테스트",
        prompt: state.promptInput,
        aiOutput,
        tools,
        blocked,
        dbSource: apiRes && apiRes.db_source ? apiRes.db_source : "local-sim",
        summary: isSafeScenario ? "정상 작동 확인" : "비정상 동작 포착"
      };
      if (!state.logsByScenario[sc.id]) state.logsByScenario[sc.id] = [];
      state.logsByScenario[sc.id].unshift(logItem);
      state.xp += 15;
      state.isRunningAgent = false;
      render();
    }

    function placeEvidenceBlock(evText) {
      const sc = getScenario();
      const emptySlot = sc.slots.find(s => !state.reportDraft.slots[s]) || sc.slots[0];
      state.reportDraft.slots[emptySlot] = evText;
      state.reportDraft.submitted = false;
      render();
    }

    function removeSlotValue(slotName) {
      delete state.reportDraft.slots[slotName];
      state.reportDraft.submitted = false;
      render();
    }

    function selectVerdict(v) {
      state.reportDraft.verdict = v;
      state.reportDraft.submitted = false;
      render();
    }

    function submitReport() {
      const sc = getScenario();
      const logs = state.logsByScenario[sc.id] || [];
      if (logs.length === 0) {
        alert("먼저 [실험실]에서 프롬프트를 실행해 AI가 어떤 문제 출력을 내보내는지 확인해 주세요!");
        return;
      }

      const feedback = [];
      let allSlotsMatch = true;
      sc.slots.forEach(slotName => {
        const chosen = state.reportDraft.slots[slotName];
        const expected = sc.expectedSlots[slotName];
        if (!chosen) {
          allSlotsMatch = false;
          feedback.push(`• [${slotName}] 빈칸에 근거 블록을 넣어주세요.`);
        } else if (chosen !== expected) {
          allSlotsMatch = false;
          feedback.push(`• [${slotName}] 선택한 근거가 AI 실제 출력과 맞지 않아요. 위 실험실 출력 결과를 다시 확인해 보세요.`);
        }
      });

      const verdictMatch = state.reportDraft.verdict === sc.expectedVerdict;
      if (!verdictMatch) {
        feedback.push(`• 최종 판정이 실제 결과와 달라요. (이 사건의 올바른 판정: '${sc.expectedVerdict}')`);
      }

      const isCorrect = allSlotsMatch && verdictMatch;
      state.reportDraft.submitted = true;
      state.reportDraft.isCorrect = isCorrect;
      state.reportDraft.feedback = feedback;

      if (isCorrect) {
        const wasAlreadyDone = state.reportsByScenario[sc.id]?.isCorrect;
        state.reportsByScenario[sc.id] = JSON.parse(JSON.stringify(state.reportDraft));
        if (!wasAlreadyDone) state.xp += 60;
      }
      render();
    }

    function goNextAttackTest() {
      const nextTodo = SCENARIOS.find(s => !state.reportsByScenario[s.id]?.isCorrect);
      if (nextTodo) {
        selectScenario(nextTodo.id);
        state.view = "lab";
      } else {
        state.view = "defense";
        const firstUnverified = SCENARIOS.find(s => !state.defenseTestResultByScenario[s.id]?.passed);
        if (firstUnverified) selectScenario(firstUnverified.id);
      }
      render();
    }

    function toggleDefenseBlock(blockId) {
      const sc = getScenario();
      if (!state.defenseBlocksByScenario[sc.id]) state.defenseBlocksByScenario[sc.id] = [];
      const arr = state.defenseBlocksByScenario[sc.id];
      const idx = arr.indexOf(blockId);
      if (idx >= 0) arr.splice(idx, 1);
      else arr.push(blockId);
      render();
    }

    async function runDefenseVerify() {
      if (state.isRunningAgent) return;
      const sc = getScenario();
      const picked = state.defenseBlocksByScenario[sc.id] || [];
      state.isRunningAgent = true;
      render();

      const [attackApi, normalApi] = await Promise.all([
        callAgentRunApi({
          scenarioId: sc.id,
          mode: "defense_attack",
          prompt: sc.defaultPrompt,
          activeBlocks: picked
        }),
        callAgentRunApi({
          scenarioId: "S10",
          mode: "defense_normal",
          prompt: SCENARIOS[9].defaultPrompt,
          activeBlocks: picked
        })
      ]);

      const hasAllRequired = sc.requiredBlocks.every(req => picked.includes(req));
      const isBenignScenario = sc.expectedVerdict === "문제 없음";

      const attackBlocked = attackApi && typeof attackApi.blocked === "boolean"
        ? attackApi.blocked
        : (isBenignScenario ? true : hasAllRequired);

      const attackOutput = attackApi && attackApi.ai_output
        ? attackApi.ai_output
        : (attackBlocked ? sc.safeOutput : sc.unsafeOutput);

      const attackTools = attackApi && Array.isArray(attackApi.tools_called)
        ? attackApi.tools_called
        : (attackBlocked ? sc.safeTools : sc.unsafeTools);

      const normalAllowed = normalApi && typeof normalApi.blocked === "boolean"
        ? !normalApi.blocked
        : picked.includes("allow_lab_only");

      const normalOutput = normalApi && normalApi.ai_output
        ? normalApi.ai_output
        : (normalAllowed
            ? "✅ [정상 작동] P-101 김민수 검사 요약이 정상 출력되었습니다."
            : "⚠️ [과도 차단] 정상적인 검사 요약 도구까지 막혔어요. [✅ 검사 기록·요약 도구만 허용] 블록을 꼭 넣어주세요!");

      const normalTools = normalApi && Array.isArray(normalApi.tools_called)
        ? normalApi.tools_called
        : (normalAllowed ? ["lab_records", "report_summary"] : []);

      const attackLog = {
        id: "DEF-" + Math.floor(100 + Math.random() * 900),
        time: new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
        mode: "방어 재시험",
        prompt: sc.defaultPrompt,
        aiOutput: attackOutput,
        tools: attackTools,
        blocked: attackBlocked,
        dbSource: attackApi && attackApi.db_source ? attackApi.db_source : "local-sim",
        summary: attackBlocked ? "방어 성공" : "방어 부족"
      };

      const normalLog = {
        id: "NRM-" + Math.floor(100 + Math.random() * 900),
        time: attackLog.time,
        mode: "정상 업무 점검",
        prompt: SCENARIOS[9].defaultPrompt,
        aiOutput: normalOutput,
        tools: normalTools,
        blocked: !normalAllowed,
        summary: normalAllowed ? "정상 작동 유지" : "정상 업무 막힘"
      };

      const passed = attackBlocked && normalAllowed;
      const wasPassed = state.defenseTestResultByScenario[sc.id]?.passed;
      state.defenseTestResultByScenario[sc.id] = {
        passed,
        attackLog,
        normalLog,
        guideMsg: passed
          ? "🎉 완벽해요! 보고서에서 찾은 취약점은 막고, 정상 검사 요약은 잘 작동합니다!"
          : !attackBlocked
          ? "⚠️ 아직 보고서에서 찾은 공격이 뚫려요! 위 보고서 근거를 보고 필요한 안전 블록을 더 골라 주세요."
          : "⚠️ 공격은 막았지만 정상 검사 요약까지 막혔어요! [✅ 검사 기록·요약 도구만 허용] 블록을 추가해 주세요."
      };

      if (passed && !wasPassed) {
        state.xp += 80;
        if (verifiedPolicyCount() === SCENARIOS.length) {
          state.xp += 300;
          state.showEpilogue = true;
          state.epilogueStep = 0;
        }
      }
      state.isRunningAgent = false;
      render();
    }

    function makeCanvasTex(w, h, drawFn) {
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      drawFn(ctx, w, h);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function createBrickTexture() {
      return makeCanvasTex(128, 128, (ctx, w, h) => {
        ctx.fillStyle = "#e3ccb0";
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = "#c8ae8c";
        ctx.lineWidth = 1.5;
        const bh = 16, bw = 32;
        for (let row = 0; row < h / bh; row++) {
          const off = (row % 2) * (bw / 2);
          for (let col = -1; col < w / bw + 1; col++) {
            ctx.strokeRect(col * bw + off, row * bh, bw, bh);
          }
        }
        ctx.beginPath();
        ctx.arc(w / 2, h / 2, 28, 0, Math.PI * 2);
        ctx.strokeStyle = "#b59876";
        ctx.lineWidth = 2;
        ctx.stroke();
      });
    }

    function createStoneWallTex(baseColor) {
      return makeCanvasTex(64, 64, (ctx, w, h) => {
        ctx.fillStyle = baseColor;
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = "rgba(0,0,0,0.09)";
        ctx.lineWidth = 1;
        const sh = 8, sw = 16;
        for (let r = 0; r < h / sh; r++) {
          const off = (r % 2) * (sw / 2);
          for (let c = -1; c < w / sw + 1; c++) {
            ctx.strokeRect(c * sw + off, r * sh, sw, sh);
          }
        }
      });
    }

    function buildClouds() {
      const cloudPositions = [
        [-35, 22, -40], [30, 25, -50], [50, 20, -20], [-50, 23, 10],
        [0, 26, -60], [40, 21, 30], [-40, 24, -55]
      ];

        color: 0xf8fbff, roughness: 1, transparent: true, opacity: 0.88
      });
      cloudPositions.forEach(([cx, cy, cz]) => {
        const cg = new THREE.Group();
        cg.position.set(cx, cy, cz);
        const puffs = [
          [0, 0, 0, 2.2], [-1.8, 0.3, 0.5, 1.8], [1.6, 0.2, -0.3, 1.9],
          [-0.5, 0.6, -0.8, 1.5], [0.8, 0.5, 0.6, 1.6]
        ];
        puffs.forEach(([px, py, pz, r]) => {
          const puff = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), cloudMat);
          puff.position.set(px, py, pz);
          cg.add(puff);
        });
        cg.scale.set(1.2 + Math.random() * 0.5, 0.6, 1.0 + Math.random() * 0.3);
        scene.add(cg);
        animatedProps.push({ mesh: cg, type: "cloud", baseX: cx, speed: 0.3 + Math.random() * 0.4 });
      });
    }

    function setupInteractions(container) {
      container.addEventListener("pointerdown", e => {
        isDragging = true;
        dragDistance = 0;
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      });

      window.addEventListener("pointermove", e => {
        if (!isDragging) return;
        const dx = e.clientX - prevMouseX;
        const dy = e.clientY - prevMouseY;
        dragDistance += Math.abs(dx) + Math.abs(dy);
        targetCameraAngle -= dx * 0.0055;
        cameraHeight = Math.max(10, Math.min(25, cameraHeight + dy * 0.04));
        prevMouseX = e.clientX;
        prevMouseY = e.clientY;
      });

      window.addEventListener("pointerup", e => {
        if (!isDragging) return;
        isDragging = false;
        if (dragDistance < 6 && state.view === "village" && !state.showTutorial && !state.showPrologue && !state.showEpilogue) {
          mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          const allMeshes = [];
          interactiveBuildings.forEach(b => b.group.traverse(c => { if (c.isMesh) allMeshes.push(c); }));
          const hits = raycaster.intersectObjects(allMeshes);
          if (hits.length > 0 && hits[0].object.userData.viewId) {
            navigate(hits[0].object.userData.viewId);
          }
        }
      });
    }

    function updateWorldLabels() {
      const layer = document.getElementById("worldLabelsLayer");
      if (!layer) return;

      if (state.view !== "village" || state.showFinalEnding) {
        layer.innerHTML = "";
        return;
      }

      const unlocked = isWorkshopUnlocked();
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const html = interactiveBuildings.map(b => {
        const pos = new THREE.Vector3();
        b.group.getWorldPosition(pos);
        pos.y += b.heightOffset;
        pos.project(camera);

        if (pos.z > 1) return "";
        const x = (pos.x * 0.5 + 0.5) * vw;
        const y = (-(pos.y * 0.5) + 0.5) * vh;

        if (x < -160 || x > vw + 160 || y < -80 || y > vh + 80) return "";

        const isLocked = b.viewId === "defense" && !unlocked;
        const isRecommended =
          (!state.requestAccepted && b.viewId === "request") ||
          (state.requestAccepted && completedReportCount() === 0 && b.viewId === "lab");

        return `
          <button
            type="button"
            onclick="navigate('${b.viewId}')"
            style="left:${x}px; top:${y}px;"
            class="world-label ${isRecommended ? "guide-pulse" : ""} rounded-2xl border-2 border-white bg-white/95 px-3 py-1.5 shadow-lg inline-flex items-center gap-2 text-left whitespace-nowrap shrink-0"
          >
            <span class="text-lg shrink-0">${isLocked ? "🔒" : b.icon}</span>
            <span class="flex flex-col whitespace-nowrap">
              <span class="text-xs font-black text-slate-900 leading-tight whitespace-nowrap">${b.title}</span>
              <span class="text-[10px] font-bold text-slate-500 leading-tight whitespace-nowrap">${isLocked ? "보고서 12개 후 열림" : b.subtitle}</span>
            </span>
          </button>
        `;
      }).join("");

      layer.innerHTML = html;
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      cameraAngle += (targetCameraAngle - cameraAngle) * 0.08;
      const radius = 26;
      camera.position.x = Math.sin(cameraAngle) * radius;
      camera.position.z = Math.cos(cameraAngle) * radius;
      camera.position.y += (cameraHeight - camera.position.y) * 0.08;
      camera.lookAt(0, 1.5, -1.0);

      animatedProps.forEach(p => {
        if (p.type === "radar") {
          p.mesh.rotation.y = t * 0.8;
        } else if (p.type === "float") {
          p.mesh.position.y = p.baseY + Math.sin(t * 2.4) * 0.18;
          p.mesh.rotation.y = t * 1.2;
        } else if (p.type === "bob") {
          p.mesh.position.y = p.baseY + Math.abs(Math.sin(t * 3 + p.phase)) * 0.12;
        } else if (p.type === "cloud") {
          p.mesh.position.x = p.baseX + Math.sin(t * 0.05 * p.speed) * 8;
        }
      });

      renderer.render(scene, camera);
      updateWorldLabels();
    }

    window.onload = function () {
      render();
      init3DVillage();
    };
