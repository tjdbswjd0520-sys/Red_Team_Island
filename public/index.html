<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RED TEAM ISLAND V15 — Request Notice & HUD Cleanup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
  :root {
    --ink:#405246;
    --ink-strong:#34463a;
    --muted:#7b806d;
    --paper:#fffaf0;
    --paper-soft:#f3f5e9;
    --paper-warm:#fff0d8;
    --line:#c9b995;
    --line-soft:#d9d7bd;
    --wood:#ad8054;
    --wood-dark:#795735;
    --accent:#f29a37;
    --accent-dark:#b95c1d;
    --sage:#8eae8b;
    --sage-dark:#55795d;
    --danger:#d9695d;
    --success:#5a9b73;
    --shadow:0 12px 30px rgba(43,57,45,.16);
  }

  * { box-sizing:border-box; }
  html { min-height:100%; scroll-behavior:smooth; }
  body {
    min-height:100vh; margin:0; overflow-x:hidden; background:#9fc7df;
    color:var(--ink-strong); font-family:'Gowun Dodum','Noto Sans KR',sans-serif;
    user-select:none;
  }
  button,input,textarea,select { font:inherit; }
  button { -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible {
    outline:3px solid #3975bd!important; outline-offset:3px;
  }
  button:disabled { opacity:.48; cursor:not-allowed; }

  #canvas-container { position:fixed; inset:0; z-index:0; cursor:grab; filter:none!important; opacity:1!important; }
  #canvas-container:active { cursor:grabbing; }
  #canvas-container::after { content:none!important; display:none!important; }
  #canvas-container canvas { display:block; width:100%; height:100%; filter:none!important; opacity:1!important; }
  #worldLabelsLayer { z-index:12; }

  #topHud { position:relative; z-index:45; padding:10px 16px 0; pointer-events:none; }
  .hud-layout {
    width:min(100%,1500px); margin:0 auto; display:flex; align-items:center;
    justify-content:space-between; gap:12px; pointer-events:none;
  }
  .hud-brand,.hud-progress,.hud-right { pointer-events:auto; }
  .hud-brand {
    display:flex; align-items:center; gap:10px; min-width:205px; padding:7px 13px 7px 8px;
    border:2px solid #fff; border-radius:18px;
    background:linear-gradient(145deg,rgba(255,251,239,.97),rgba(239,246,235,.96));
    box-shadow:0 4px 0 rgba(121,91,58,.2),0 8px 20px rgba(37,55,47,.12);
  }
  .hud-brand-mark {
    width:42px; height:42px; flex:0 0 42px; display:grid; place-items:center;
    border:2px solid #fff; border-radius:14px; color:#fff; font-size:22px;
    background:linear-gradient(145deg,#85aa91,#4c7964); box-shadow:0 2px 6px rgba(45,73,57,.2);
  }
  .hud-brand-title { color:#425d48; font:16px 'Jua','Gowun Dodum',sans-serif; letter-spacing:.01em; line-height:1.1; }
  .hud-brand-sub { margin-top:3px; color:#8a795e; font-size:9px; font-weight:900; letter-spacing:.08em; }
  .hud-progress {
    display:flex; align-items:center; gap:12px; min-width:280px; padding:9px 14px;
    border:1.5px solid rgba(255,255,255,.95); border-radius:999px;
    background:rgba(255,250,238,.92); box-shadow:0 4px 15px rgba(48,62,53,.11);
  }
  .hud-progress-item { display:flex; align-items:center; gap:5px; color:#6f705c; font-size:10px; font-weight:900; white-space:nowrap; }
  .hud-progress-item strong { color:#526f56; font:14px 'Jua','Gowun Dodum',sans-serif; }
  .hud-progress-track { height:7px; flex:1; min-width:48px; border-radius:99px; overflow:hidden; background:#e3ddc9; box-shadow:inset 0 1px 2px rgba(65,58,43,.12); }
  .hud-progress-track i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#9ac58e,#f4b24a); }
  .hud-right { display:flex; align-items:center; justify-content:flex-end; gap:7px; flex-wrap:wrap; }
  .hud-icon-btn {
    width:42px; height:42px; display:inline-flex; align-items:center; justify-content:center;
    border:2px solid #fff; border-radius:50%; color:#617252; font-size:18px;
    background:linear-gradient(180deg,#fffdf5,#eaf1e6); box-shadow:0 4px 0 rgba(121,91,58,.18);
  }
  .hud-icon-btn:hover { transform:translateY(-1px); }

  #toastArea { position:fixed; top:78px; left:50%; transform:translateX(-50%); width:min(94vw,680px); margin:0; z-index:75; pointer-events:auto; }
  #toastArea > div { border:1px solid var(--line); box-shadow:0 8px 22px rgba(48,57,43,.16); animation:toastIn .22s ease-out both; }
  @keyframes toastIn { from{opacity:0;transform:translateY(-7px)} to{opacity:1;transform:translateY(0)} }

  #appMain {
    width:100%; max-width:none; margin:0 auto; padding:10px 18px 126px;
    pointer-events:none; position:relative; z-index:20;
  }
  #appMain h1,#appMain h2,#appMain h3,.screen-title { font-family:'Jua','Gowun Dodum',sans-serif; letter-spacing:-.025em; }
  #appMain p,#appMain li { line-height:1.65; }
  .game-content-frame { width:min(100%,1500px); margin:0 auto; pointer-events:none; }
  .facility-window {
    width:min(100%,1180px); max-height:calc(100vh - 232px); margin:0 auto;
    overflow:auto; overscroll-behavior:contain; scrollbar-width:thin;
    scrollbar-color:#bca17c rgba(255,250,238,.55); pointer-events:auto;
    animation:facilityWindowIn .18s ease-out both;
  }
  @keyframes facilityWindowIn {
    from { opacity:0; transform:translateY(8px) scale(.99); }
    to { opacity:1; transform:translateY(0) scale(1); }
  }
  @media(max-height:760px) { .facility-window { max-height:calc(100vh - 205px); } }
  @media(max-width:640px) { .facility-window { max-height:calc(100vh - 205px); } }
  .scene-card,.parchment-panel,.attack-card,.request-board { pointer-events:auto; }

  .parchment-panel {
    color:var(--ink-strong); border:2px solid #cda16d; border-radius:23px;
    background:radial-gradient(ellipse at 5% 0%,rgba(255,255,255,.92),transparent 35%),
      linear-gradient(145deg,rgba(255,251,241,.98),rgba(240,246,235,.97));
    box-shadow:0 0 0 3px rgba(255,250,237,.8) inset,0 8px 0 rgba(148,105,59,.22),var(--shadow);
  }
  .inner-card,.report-card,.lab-side-card,.lab-stage,.workshop-panel {
    color:#53634f; border:1.5px solid #cad8c4; border-radius:16px;
    background:linear-gradient(145deg,#fffdf7,#eff5ec);
    box-shadow:0 3px 12px rgba(59,82,67,.07),inset 0 1px 0 rgba(255,255,255,.95);
  }
  .wood-banner {
    color:#684b2e; border:1.5px solid #c18a4e; border-radius:999px;
    background:linear-gradient(180deg,#fff9e9,#f4dcb8);
    box-shadow:0 3px 0 rgba(142,83,35,.16),inset 0 1px 0 #fff; text-shadow:none;
  }
  .btn-wood-orange {
    min-height:42px; border:2px solid #b75e20; border-radius:999px;
    color:#653b1c; font-weight:900; text-shadow:0 1px 0 rgba(255,255,255,.42);
    background:linear-gradient(180deg,#ffe17d 0%,#ffb649 48%,#f58a2e 100%);
    box-shadow:0 4px 0 #a94e19,inset 0 2px 0 rgba(255,255,255,.72);
    transition:transform .15s ease,filter .15s ease,box-shadow .15s ease;
  }
  .btn-wood-orange:hover:not(:disabled) { filter:brightness(1.045) saturate(1.04); transform:translateY(-1px); }
  .btn-wood-orange:active:not(:disabled) { transform:translateY(2px); box-shadow:0 1px 0 #a94e19; }
  .hub-pill-card {
    border:1.5px solid #fff; border-radius:18px; color:#53634f;
    background:linear-gradient(180deg,rgba(255,251,240,.97),rgba(239,246,235,.96));
    box-shadow:0 5px 0 rgba(167,111,62,.18),0 10px 24px rgba(60,63,45,.13);
  }
  .ui-status {
    display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px;
    border:1px solid #d9d9c2; background:#fffaf0; color:#6d765d; font-size:11px; font-weight:900; white-space:nowrap;
  }
  .ui-status.is-done { background:#e8f5e9; border-color:#b5d7ba; color:#2d7047; }
  .screen-ribbon {
    display:inline-flex; align-items:center; gap:9px; padding:8px 17px;
    border:1.5px solid #cda16d; border-radius:999px;
    background:linear-gradient(180deg,#fff9e9,#f4e2c4); color:#5f543c;
    box-shadow:0 3px 0 rgba(151,91,42,.15); font:18px 'Jua','Gowun Dodum',sans-serif;
  }
  .screen-kicker { color:#a96c37; font:11px 'Jua','Gowun Dodum',sans-serif; letter-spacing:.06em; }

  /* Common mission progress path: same location and status language in every facility. */
  .operation-path {
    display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:7px;
    margin:4px auto 13px; padding:9px; border:1.5px solid rgba(255,255,255,.95);
    border-radius:19px; background:linear-gradient(180deg,rgba(255,251,239,.95),rgba(239,245,232,.94));
    box-shadow:0 5px 18px rgba(43,57,45,.12); pointer-events:auto;
  }
  .path-step {
    min-width:0; display:flex; align-items:center; gap:8px; padding:8px 9px;
    border:1px solid transparent; border-radius:13px; color:#7b7d68;
  }
  .path-step-mark {
    width:28px; height:28px; flex:0 0 28px; display:grid; place-items:center;
    border-radius:10px; background:#e8e9d9; color:#7c806a; font:13px 'Jua',sans-serif;
  }
  .path-step-title { font:12px 'Jua','Gowun Dodum',sans-serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .path-step-state { display:block; margin-top:2px; color:#9a927d; font-size:9px; font-weight:900; }
  .path-step.is-active { border-color:#e5b36f; background:linear-gradient(180deg,#fff8e8,#ffedcf); color:#774b27; box-shadow:0 2px 7px rgba(193,130,56,.12); }
  .path-step.is-active .path-step-mark { color:#fff; background:linear-gradient(145deg,#f7b64e,#df7c2d); }
  .path-step.is-done .path-step-mark { color:#fff; background:linear-gradient(145deg,#8ebc91,#578464); }
  .path-step.is-done .path-step-state { color:#568162; }

  /* Village labels and world interaction */
  .world-label {
    position:absolute; transform:translate(-50%,-100%); pointer-events:auto; cursor:pointer;
    white-space:nowrap; width:max-content; max-width:none; flex-shrink:0; z-index:15;
    padding:7px 13px!important; border:2px solid #fff8e8!important; border-radius:999px!important;
    color:#704322!important; background:linear-gradient(180deg,#fff9ed,#ffe8c7)!important;
    box-shadow:0 4px 0 rgba(150,88,43,.2),0 7px 14px rgba(64,44,27,.16)!important;
    transition:transform .15s ease,opacity .2s ease;
  }
  .world-label:hover { transform:translate(-50%,-106%) scale(1.05); z-index:20; }
  .world-label .label-title { color:#633d21!important; font:13px 'Jua','Gowun Dodum',sans-serif; }
  .world-label .label-subtitle { color:#8c694b!important; font-size:10px!important; }
  .guide-pulse { animation:pulseGlow 1.6s infinite; border-color:#f97316!important; }
  @keyframes pulseGlow { 0%,100%{box-shadow:0 0 0 0 rgba(249,115,22,.55)} 50%{box-shadow:0 0 0 9px rgba(249,115,22,0)} }

  /* Persistent facility navigation */
  #bottomDock { position:fixed; left:50%; bottom:max(10px,env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:55; width:min(96vw,980px); pointer-events:auto; }
  .floating-dock {
    display:flex; align-items:center; justify-content:space-between; gap:5px; padding:7px;
    border:2px solid #fff; border-radius:23px;
    background:linear-gradient(180deg,rgba(255,251,241,.98),rgba(236,244,231,.97));
    box-shadow:0 5px 0 rgba(144,103,62,.2),0 12px 30px rgba(36,53,45,.2);
  }
  .dock-tab {
    min-width:0; min-height:56px; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:5px 7px; border:1px solid transparent; border-radius:15px; color:#6c765e;
    font-family:'Jua','Gowun Dodum',sans-serif; font-size:12px; transition:background .16s,color .16s,transform .16s;
  }
  .dock-tab span:first-child { font-size:21px; line-height:1; filter:drop-shadow(0 1px 0 rgba(255,255,255,.55)); }
  .dock-tab:hover:not(:disabled) { background:#f6ead5; transform:translateY(-2px); }
  .dock-tab.active { color:#fff; background:linear-gradient(180deg,#f4ad50,#e47a2b); border-color:#d66c28; box-shadow:0 3px 0 #b65316,inset 0 1px 0 #ffeac4; }
  .dock-tab:disabled { opacity:.42; }

  /* Facility scenes */
  .home-mail-card {
    position:relative; width:min(390px,calc(100vw - 30px)); margin:0 0 8px 0; padding:14px 16px;
    border:2px solid #fff; border-radius:21px; background:linear-gradient(180deg,#fff9ed,#ffe9ca);
    box-shadow:0 5px 0 rgba(156,97,48,.22),0 11px 25px rgba(45,42,30,.17);
  }
  .home-mail-card:before { content:'NEW'; position:absolute; top:-10px;left:15px;padding:2px 9px;border-radius:99px;background:#e66b54;color:#fff;font:10px 'Jua',sans-serif;box-shadow:0 2px 4px #aa5135; }
  .request-scene { max-width:1120px; min-height:0; margin:4px auto 0; display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,220px);align-items:center;gap:14px;pointer-events:none; }
  .request-board { width:100%; pointer-events:auto; padding:18px; max-height:100%; overflow:visible; }
  .request-company { display:flex;align-items:center;gap:13px;padding:12px 14px;border:1.5px solid #e8c69e;border-radius:17px;background:linear-gradient(90deg,#fff2dc,#ffe6ca); }
  .request-folder { width:58px;height:54px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(180deg,#ffdf8d,#f29b3b);border:2px solid #d57e27;font-size:32px;box-shadow:inset 0 2px 0 #fff4d5; }
  .request-npc { align-self:center;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:6px;padding:0;pointer-events:none;filter:drop-shadow(0 5px 8px rgba(54,70,58,.16)); }
  .request-npc-kicker { display:inline-block;margin-bottom:5px;color:#8a754a;font-size:9px;letter-spacing:.08em; }
  .request-npc .npc-speech { max-width:245px;padding:16px 17px;border-color:#b7c9ac;background:linear-gradient(145deg,#fffdf5,#edf4e9);color:#53694f;text-align:left; }
  .npc-speech { max-width:190px;padding:12px 14px;border:2px solid #dca568;border-radius:19px;background:#fff7e7;color:#66452a;font-weight:900;font-size:12px;text-align:center; }
  .lab-scene { max-width:1320px;margin:6px auto 0; }
  .attack-card { min-height:155px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:13px 10px;border:2px solid #d9cce2;border-radius:18px;background:linear-gradient(180deg,#fffaff,#f0f1e9);box-shadow:0 4px 0 rgba(129,89,145,.12);color:#5d5d53;transition:transform .15s,border-color .15s,box-shadow .15s; }
  .attack-card:hover { transform:translateY(-3px);border-color:#f49c38;box-shadow:0 5px 0 rgba(190,119,49,.16); }
  .attack-card.active { border:3px solid #f2a03d;background:linear-gradient(180deg,#fff8e9,#ffe8c9);box-shadow:0 0 0 3px #ffe2b6,0 5px 0 rgba(178,95,32,.18); }
  .attack-card .attack-icon { font-size:36px;line-height:1.1; }
  .lab-side-card { padding:14px; }
  .lab-stage { padding:14px; background:rgba(255,250,240,.94); }
  .workshop-layout { display:grid;grid-template-columns:minmax(185px,.8fr) minmax(320px,1.5fr) minmax(170px,.7fr);gap:12px;align-items:stretch; }
  .workshop-panel { padding:12px;min-width:0; }
  .workshop-block { width:100%;text-align:left;display:flex;align-items:center;gap:8px;border:1.5px solid #d48a39;border-radius:12px;padding:9px 10px;background:linear-gradient(180deg,#ffe28b,#ffb93e);color:#6a431e;font-size:11px;font-weight:900;box-shadow:0 3px 0 #b96c24;cursor:grab; }
  .workshop-block.selected { background:linear-gradient(180deg,#a9e0bd,#64ba83);border-color:#39895a;color:#174b32;box-shadow:0 3px 0 #397c53; }
  .workshop-workspace { min-height:270px;border:2px dashed #c9ad83;border-radius:15px;background:radial-gradient(circle at 50% 38%,rgba(255,231,207,.8),rgba(255,249,240,.94));padding:12px; }
  .workspace-empty { min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#a28a6d;font-weight:900;gap:6px; }
  .placed-block { border:1px solid #8bbd99;background:linear-gradient(180deg,#e9f7ec,#d4efdc);border-radius:10px;padding:8px 10px;margin:6px 0;color:#28583a;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:8px; }
  .hint-panel { border:2px solid #d8c59f;border-radius:17px;background:linear-gradient(180deg,#fff9ea,#ffedd2);padding:12px; }
  .block-chip { background:linear-gradient(180deg,#ffe59a,#ffb83e);border:1.5px solid #c27628;box-shadow:0 3px 0 #a55c1e;color:#70431d; }

  /* Report and completion views */
  .report-board { display:grid;grid-template-columns:1.02fr .88fr 1.18fr .92fr;gap:10px;align-items:stretch; }
  .report-card { min-width:0;padding:12px; }
  .report-card-title { font:14px 'Jua','Gowun Dodum',sans-serif;color:#526d56;margin-bottom:8px; }
  .report-evidence-chip { display:block;width:100%;text-align:left;padding:7px 9px;margin:5px 0;border:1px solid #b7c8ae;border-radius:10px;background:linear-gradient(180deg,#f8f5dc,#e6efcf);color:#536543;font-size:10px;font-weight:900;box-shadow:0 2px 0 rgba(113,139,84,.14); }
  .report-evidence-chip:hover { filter:brightness(1.03); transform:translateY(-1px); }
  .report-slot { min-height:49px;border:1.5px dashed #b8cdbb;border-radius:11px;background:linear-gradient(180deg,#fffdf8,#f1f5ed);padding:7px;margin:6px 0;text-align:left;width:100%;font-size:10px;color:#5d705e; }
  .report-slot.active { border:2px solid #e3a24c;background:#fff4dc;box-shadow:0 0 0 2px rgba(227,162,76,.18); }
  .report-verdict { border:2px solid #c7d4c5;border-radius:12px;padding:9px 7px;font-size:12px;font-weight:900;background:linear-gradient(180deg,#fffdf8,#f1f4ed);color:#5a6a58; }
  .report-verdict.active-bad { border-color:#df877a;background:#fff0ec;color:#a34a40; }
  .report-verdict.active-good { border-color:#88b99b;background:#e8f4e9;color:#326448; }
  .report-agent-mark { width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#8bb7bd,#496f78);border:2px solid #fff;color:#fff;font:900 14px 'Jua',sans-serif;box-shadow:0 2px 6px rgba(43,70,73,.18); }
  .completion-scene { max-width:650px;margin:7vh auto 0;position:relative;text-align:center;padding:24px; }
  .completion-ribbon { display:inline-block;padding:12px 30px;border:3px solid #bd5917;border-radius:20px;background:linear-gradient(180deg,#ffcf65,#f27a25);color:#fff;font:27px 'Jua',sans-serif;text-shadow:0 2px 1px rgba(106,48,12,.3);box-shadow:0 6px 0 #a94c19;transform:rotate(-2deg); }
  .completion-mascots { display:flex;align-items:center;justify-content:center;gap:12px;margin:20px 0 8px; }
  .completion-mark { width:58px;height:58px;display:grid;place-items:center;border-radius:18px;border:2px solid #d9bd8e;background:linear-gradient(145deg,#fffdf4,#eff4e8);font-size:27px;box-shadow:0 4px 10px rgba(68,79,53,.12); }
  .completion-card { border:3px solid #d68b42;border-radius:23px;background:linear-gradient(180deg,#fff8e8,#ffe7c7);padding:22px;box-shadow:0 7px 0 rgba(154,89,40,.3),0 17px 34px rgba(45,30,20,.19); }
  .scenario-modal-card { border:1.5px solid #c8d8ca!important;background:linear-gradient(145deg,#fffdf7,#edf5ef)!important;box-shadow:0 3px 10px rgba(51,82,66,.08)!important;color:#435344!important; }
  .scenario-modal-card:hover,.scenario-modal-card[aria-pressed="true"] { border-color:#dfa04d!important;background:linear-gradient(145deg,#fff8e8,#e9f2e8)!important;box-shadow:0 0 0 2px rgba(232,178,93,.2),0 5px 14px rgba(70,92,67,.12)!important; }

  /* Shared modal frame for story, scenario, report and unlock dialogs */
  #scenarioModal,#reportModal { isolation:isolate; }
  #scenarioModal > div:first-child,#reportModal [aria-label="보고서 창 닫기"],#prologueModal,#epilogueModal,#tutorialModal { backdrop-filter:none!important;-webkit-backdrop-filter:none!important; }
  .modal-world-panel {
    position:relative;color:var(--ink)!important;border:3px solid var(--wood)!important;border-radius:27px!important;
    background:radial-gradient(ellipse at 6% 0%,rgba(255,255,255,.9),transparent 34%),
      radial-gradient(ellipse at 100% 100%,rgba(196,220,204,.28),transparent 38%),
      linear-gradient(145deg,rgba(255,252,244,.985),rgba(237,245,238,.985))!important;
    box-shadow:0 0 0 3px rgba(255,250,237,.92),0 0 0 6px rgba(140,105,69,.2),0 22px 56px rgba(27,47,53,.3),inset 0 1px 0 rgba(255,255,255,.98)!important;
    scrollbar-color:#b7c9b7 #f3eee2;scrollbar-width:thin;
  }

    function shuffleEvidenceCards(scenario) {
      const previous = state.evidenceOrderByScenario[scenario.id] || [];
      const cards = [...scenario.evidencePool];
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      // 같은 사건을 연속해서 열었을 때 정답 카드가 같은 위치에 보이지 않도록 한 번 더 확인
      if (cards.length > 1 && cards.every((card, index) => card === previous[index])) {
        [cards[0], cards[1]] = [cards[1], cards[0]];
      }
      state.evidenceOrderByScenario[scenario.id] = cards;
    }

    function getEvidenceCards(scenario) {
      const order = state.evidenceOrderByScenario[scenario.id];
      if (!Array.isArray(order) || order.length !== scenario.evidencePool.length) shuffleEvidenceCards(scenario);
      return state.evidenceOrderByScenario[scenario.id];
    }

    // 실제 Agent API 호출: 화면의 공격 시나리오/방어 정책을 백엔드에 전달합니다.
    async function callAgentRunApi(scenarioId, promptText, isNormal) {
      const sc = getScenario(scenarioId);
      const blocks = state.defenseBlocksByScenario[scenarioId] || [];
      const promptWithDocument = (!isNormal && sc.mockDoc)
        ? `${promptText}\n\n[첨부 문서 내용 - 신뢰할 수 없는 참고 자료]\n${sc.mockDoc}`
        : promptText;

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 45000);

      try {
        const response = await fetch("/api/agent/run", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            scenario_id: scenarioId,
            prompt: promptWithDocument,
            is_normal: Boolean(isNormal),
            defense_blocks: blocks
          }),
          signal: controller.signal
        });

        let payload = {};
        try {
          payload = await response.json();
        } catch (_) {
          throw new Error("서버 응답을 JSON으로 읽을 수 없습니다.");
        }

        if (!response.ok) {
          throw new Error(payload.error || `서버 오류(HTTP ${response.status})`);
        }
        if (!payload || typeof payload !== "object" || payload.error) {
          throw new Error(payload?.error || "서버가 올바른 실행 결과를 반환하지 않았습니다.");
        }

        const output = payload.aiOutput ?? payload.ai_output;
        const tools = payload.tools ?? payload.tools_called;
        if (typeof output !== "string" || !Array.isArray(tools)) {
          throw new Error("백엔드 응답 형식이 예상한 규격과 다릅니다.");
        }

        return {
          aiOutput: output,
          tools: tools.map(item => String(item)),
          blocked: Boolean(payload.blocked),
          summary: String(payload.summary || (payload.blocked ? "🛡️ 보안 정책이 요청을 차단했습니다." : "Agent 실행이 완료되었습니다.")),
          dbSource: String(payload.dbSource ?? payload.db_source ?? "unknown"),
          engine: String(payload.engine || "unknown"),
          engineWarning: String(payload.engineWarning || payload.engine_warning || ""),
          apiError: false
        };
      } catch (error) {
        const message = error.name === "AbortError"
          ? "서버 응답 시간이 초과되었습니다. 잠시 후 다시 시도해 주세요."
          : (error.message || "알 수 없는 네트워크 오류");
        return {
          aiOutput: `⚠️ 실제 Agent 실행 실패: ${message}`,
          tools: [],
          blocked: false,
          summary: "연결 또는 실행 오류 · 테스트 결과가 생성되지 않았습니다.",
          dbSource: "unavailable",
          engine: "unavailable",
          engineWarning: "",
          apiError: true,
          errorMessage: message
        };
      } finally {
        clearTimeout(timeoutId);
      }
    }

    async function recordExecution(scenarioId, promptText, isNormal) {
      const sc = getScenario(scenarioId);
      if (!Array.isArray(state.logsByScenario[scenarioId])) {
        state.logsByScenario[scenarioId] = [];
      }

      const apiResult = await callAgentRunApi(scenarioId, promptText, isNormal);
      const logItem = {
        id: "LOG-" + Math.floor(100 + Math.random() * 900),
        time: new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit" }),
        mode: isNormal ? "정상 업무" : "공격 테스트",
        prompt: promptText,
        tools: apiResult.tools,
        blocked: apiResult.blocked,
        summary: apiResult.summary,
        aiOutput: apiResult.aiOutput,
        dbSource: apiResult.dbSource,
        engine: apiResult.engine,
        engineWarning: apiResult.engineWarning,
        apiError: apiResult.apiError,
        errorMessage: apiResult.errorMessage || ""
      };
      state.logsByScenario[scenarioId].unshift(logItem);
      return logItem;
    }

    async function runAttackTest() {
      if (state.apiBusy) return;
      const sc = getScenario();
      const promptText = state.promptInput.trim() || sc.prompt;
      const isNormal = state.testMode === "normal";
      state.apiBusy = true;
      setToast(isNormal
        ? "🔄 LabInsight의 정상 업무 권한 범위를 확인하고 있어요..."
        : "🔄 LabInsight에 공격 테스트를 요청하고 있어요...");
      render();

      try {

        state.labStep = "result";
        if (log.apiError) {
          setToast("⚠️ 실제 Agent 실행에 실패했어요. 오류 내용을 확인해 주세요.");

        }
      } finally {
        state.apiBusy = false;
        render();
      }
    }

      state.labStep = "prompt";
      render();

    function loadDefaultPrompt() {
      state.promptInput = getScenario().prompt;
      render();
    }

    function selectReportSlot(slotName) {
      const sc = getScenario();
      if (!sc.slots.includes(slotName)) return;
      state.reportDraft.activeSlot = slotName;
      render();
    }

    function placeEvidenceBlock(evText) {
      const sc = getScenario();
      const target = sc.slots.includes(state.reportDraft.activeSlot)
        ? state.reportDraft.activeSlot
        : (sc.slots.find(slot => !state.reportDraft.slots[slot]) || sc.slots[0]);
      Object.keys(state.reportDraft.slots).forEach(slot => {
        if (state.reportDraft.slots[slot] === evText) delete state.reportDraft.slots[slot];
      });
      state.reportDraft.slots[target] = evText;
      state.reportDraft.activeSlot = sc.slots.find(slot => !state.reportDraft.slots[slot]) || target;
      state.reportDraft.submitted = false;
      state.reportDraft.feedback = [];
      render();
    }

    function removeSlotValue(slotName) {
      delete state.reportDraft.slots[slotName];
      state.reportDraft.activeSlot = slotName;
      state.reportDraft.submitted = false;
      state.reportDraft.feedback = [];
      render();
    }

    function selectVerdict(v) {
      state.reportDraft.verdict = v;
      state.reportDraft.submitted = false;
      render();
    }

    function submitReport() {
      const countBeforeSubmit = completedReportCount();
      const sc = getScenario();
      const logs = state.logsByScenario[sc.id] || [];
      if (logs.length === 0) {
        setToast("⚠️ 먼저 실험실에서 테스트를 1번 실행해 문제의 출력을 확인해야 해요!");
        return;
      }

      const missingSlot = sc.slots.find(s => !state.reportDraft.slots[s]);
      if (missingSlot) {
        setToast("⚠️ 빈칸에 근거 단서 카드를 모두 채워 주세요!");
        return;
      }

      const feedback = [];
      sc.slots.forEach(slotName => {
        const chosen = state.reportDraft.slots[slotName];
        const expected = sc.answerSlots[slotName];
        if (chosen !== expected) {
          feedback.push(`❌ [${slotName}] 칸에 고른 근거는 이 사건의 문제점과 맞지 않아요. 위 AI 출력과 호출된 도구를 다시 살펴보세요.`);
        }
      });

      if (state.reportDraft.verdict !== sc.answerVerdict) {
        feedback.push("❌ 최종 판정이 맞지 않아요. 실험실에서 확인한 AI 출력이 병원 안전 규칙을 지켰는지 다시 판단해 보세요.");
      }

      state.reportDraft.submitted = true;
      state.reportDraft.isCorrect = feedback.length === 0;
      state.reportDraft.feedback = feedback;

      if (state.reportDraft.isCorrect) {
        const isFirst = !state.reportsByScenario[sc.id];
        state.reportsByScenario[sc.id] = {
          slots: { ...state.reportDraft.slots },
          verdict: state.reportDraft.verdict
        };
        if (isFirst) state.xp += 100;
        const justUnlockedWorkshop = countBeforeSubmit < SCENARIOS.length && isWorkshopUnlocked();
        if (justUnlockedWorkshop) {
          state.toast = "";
          state.showWorkshopUnlockModal = true;
        } else {
          setToast(`🎉 [${sc.id}] 보고서 정답! 왜 이 공격에 취약한지 근거가 잘 정리되었어요.`);
        }
      } else {
        setToast("🤔 오답이 있어요! 실험실 출력 결과와 채점 피드백을 참고해 고쳐 보세요.");
      }
      render();
    }

    function goNextAttackTest() {
      state.showReportModal = false;
      const nextSc = SCENARIOS.find(s => !state.reportsByScenario[s.id]);
      state.toast = "";
      if (nextSc) {
        state.selectedScenarioId = nextSc.id;
        state.promptInput = nextSc.prompt;
        state.labStep = (state.logsByScenario[nextSc.id] || []).length ? "result" : "select";
        state.view = "lab";
        render();
      } else {
        if (state.view !== "defense") state.viewHistory.push(state.view);
        state.view = "defense";
        render();
      }
    }

    function selectWorkshopScenario(id) {
      if (!SCENARIOS.some(item => item.id === id)) return;
      state.selectedScenarioId = id;
      state.promptInput = getScenario(id).prompt;
      state.labStep = (state.logsByScenario[id] || []).length ? "result" : "select";
      state.showHintDetails = false;
      state.draggingDefenseBlock = null;
      state.toast = "";
      render();
    }

    function toggleDefenseBlock(blockId) {
      const sc = getScenario();
      const list = state.defenseBlocksByScenario[sc.id];
      const idx = list.indexOf(blockId);
      if (idx >= 0) {
        list.splice(idx, 1);
      } else {
        list.push(blockId);
      }
      render();
    }

    async function runDefenseVerify() {
      if (state.apiBusy) return;
      const sc = getScenario();
      const blocks = state.defenseBlocksByScenario[sc.id];
      const req = sc.requiredBlocks;
      const missing = req.filter(b => !blocks.includes(b));
      const extraCount = blocks.filter(b => !req.includes(b)).length;

      state.apiBusy = true;
      setToast("🔄 공격 차단과 정상 업무 유지 여부를 실제 Agent로 검증하고 있어요...");
      render();

      try {
        const attackLog = await recordExecution(sc.id, sc.prompt, false);
        const normalLog = await recordExecution(sc.id, sc.normalPrompt, true);

        const apiFailed = attackLog.apiError || normalLog.apiError;
        const passed = !apiFailed && missing.length === 0 && extraCount === 0 &&
          attackLog.blocked && !normalLog.blocked;

        let guideMsg = "";
        if (apiFailed) {
          guideMsg = "⚠️ 서버 연결 또는 실행 오류가 발생해 검증을 완료하지 못했어요. 실행 기록의 오류 내용을 먼저 확인해 주세요.";
        } else if (passed) {
          if (!state.defenseVerifiedByScenario[sc.id]) {
            state.defenseVerifiedByScenario[sc.id] = true;
            state.xp += 150;
          }
          guideMsg = "🎉 실제 Agent 검증 통과! 공격 요청은 차단했고 정상 업무는 유지했어요.";
        } else if (missing.length > 0) {
          guideMsg = `💡 필수 방어 장치 ${missing.length}개가 빠져 있어요. 필요한 정책을 확인해 주세요.`;
        } else if (extraCount > 0) {
          guideMsg = "⚠️ 필요하지 않은 방어 장치가 포함되어 있어요. 필수 정책만 남기고 다시 검증해 주세요.";
        } else if (!attackLog.blocked) {
          guideMsg = "⚠️ 공격 요청이 차단되지 않았어요. 백엔드의 정책 적용 결과와 도구 실행 기록을 확인해 주세요.";
        } else {
          guideMsg = "⚠️ 정상 업무까지 차단되었어요. 정책 범위를 조정해 주세요.";
        }

        state.defenseTestResultByScenario[sc.id] = {
          passed,
          attackLog,
          normalLog,
          guideMsg
        };

        if (passed && isAllDefenseComplete() && !state.epilogueSeen) {
          state.xp += 300;
          state.epilogueSeen = true;
          state.epilogueStep = 0;
          state.showEpilogue = true;
        }

        setToast(apiFailed ? "⚠️ 검증 실패: 서버 실행 상태를 확인해 주세요." : (passed ? "🎉 방어 정책 검증을 통과했어요!" : "🔎 검증 결과를 확인하고 방어 정책을 조정해 보세요."));
      } finally {
        state.apiBusy = false;
        render();
      }
    }

      state.showFinalEnding = true;
      render();
    }

    function openPrologue() {
      state.prologueStep = 0;

      state.showEpilogue = true;

    function renderOperationPath() {
      const steps = [
        { id:"request", icon:"✉️", title:"기업 의뢰", hint:"범위 확인" },
        { id:"inspect", icon:"🧪", title:"대상 조사", hint:"권한·도구" },

        { id:"defense", icon:"🛠️", title:"방어 정책", hint:"재시험" }
      ];
      const current = { request:0, inspect:1, lab:2, archive:3, defense:4 }[state.view];
      const sc = getScenario();
      return `
        <nav class="operation-path" aria-label="보안 진단 업무 진행 단계">
          ${steps.map((step, index) => {
            let done = index < (current ?? 0);
            if (step.id === "request") done = !!state.requestAccepted;
            if (step.id === "inspect") done = !!state.inspectionCompleted;
            if (step.id === "lab") done = (state.logsByScenario[sc.id] || []).length > 0;
            if (step.id === "archive") done = !!state.reportsByScenario[sc.id];
            if (step.id === "defense") done = !!state.defenseVerifiedByScenario[sc.id];
            const active = index === current;
            return `<div class="path-step ${active?"is-active":""} ${done?"is-done":""}" ${active?'aria-current="step"':''}>
              <span class="path-step-mark">${done && !active ? "✓" : step.icon}</span>

          }).join("")}

      `;

    function makeCanvasTex(w, h, drawFn) {
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      drawFn(ctx, w, h);
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function createBrickTexture() {
      return makeCanvasTex(128, 128, (ctx, w, h) => {
        ctx.fillStyle = "#e3ccb0";
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = "#c8ae8c";
        ctx.lineWidth = 1.5;
        const bh = 16, bw = 32;
        for (let row = 0; row < h / bh; row++) {
          const off = (row % 2) * (bw / 2);
          for (let col = -1; col < w / bw + 1; col++) {
            ctx.strokeRect(col * bw + off, row * bh, bw, bh);
          }
        }
        ctx.beginPath();
        ctx.arc(w / 2, h / 2, 28, 0, Math.PI * 2);
        ctx.strokeStyle = "#b59876";
        ctx.lineWidth = 2;
        ctx.stroke();
      });
    }

    // 잔디 표면에 아주 약한 색 변화와 짧은 풀결을 넣어 단색 원판처럼 보이지 않게 합니다.
    function createGrassTexture() {
      return makeCanvasTex(256, 256, (ctx, w, h) => {
        ctx.fillStyle = "#83b96f";
        ctx.fillRect(0, 0, w, h);
        for (let i = 0; i < 420; i++) {
          const x = Math.random() * w;
          const y = Math.random() * h;
          const r = 1 + Math.random() * 3.2;
          ctx.fillStyle = i % 3 === 0 ? "rgba(224,239,174,.16)" : "rgba(48,111,58,.10)";
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
        for (let i = 0; i < 110; i++) {
          const x = Math.random() * w;
          const y = Math.random() * h;
          ctx.strokeStyle = "rgba(235,245,190,.20)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + (Math.random() - .5) * 5, y - 2 - Math.random() * 5);
          ctx.stroke();
        }
      });
    }

    function createTownHallSignTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 512; canvas.height = 128;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#f7e7c8";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#9b6338"; ctx.lineWidth = 10;
      ctx.strokeRect(7, 7, canvas.width - 14, canvas.height - 14);
      ctx.fillStyle = "#7b4d2d";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "bold 47px 'Noto Sans KR', sans-serif";
      ctx.fillText("마을 회관", 256, 48);
      ctx.font = "bold 20px 'Noto Sans KR', sans-serif";
      ctx.fillStyle = "#a16b3c";
      ctx.fillText("기업 의뢰 접수처", 256, 91);
      const texture = new THREE.CanvasTexture(canvas);
      texture.encoding = THREE.sRGBEncoding;
      texture.anisotropy = 4;
      return texture;
    }

    function createStoneWallTex(baseColor) {
      return makeCanvasTex(64, 64, (ctx, w, h) => {
        ctx.fillStyle = baseColor;
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = "rgba(0,0,0,0.09)";
        ctx.lineWidth = 1;
        const sh = 8, sw = 16;
        for (let r = 0; r < h / sh; r++) {
          const off = (r % 2) * (sw / 2);
          for (let c = -1; c < w / sw + 1; c++) {
            ctx.strokeRect(c * sw + off, r * sh, sw, sh);
          }
        }
      });
    }

    function buildPlazaDetails() {
      const root = new THREE.Group();
      root.userData.navigationIgnore = true;
      const stoneMat = new THREE.MeshStandardMaterial({ color: 0xd8c5a6, roughness: 0.92 });
      const soilMat = new THREE.MeshStandardMaterial({ color: 0x72583d, roughness: 1 });
      const leafMats = [
        new THREE.MeshStandardMaterial({ color: 0x5f9d59, roughness: 0.92 }),
        new THREE.MeshStandardMaterial({ color: 0x79b96b, roughness: 0.92 }),
        new THREE.MeshStandardMaterial({ color: 0x8bc778, roughness: 0.92 })
      ];
      const petalColors = [0xf2c76e, 0xe99eb0, 0xf7eee0, 0xaaa0dc, 0xe98677];
      const petalMats = petalColors.map(color => new THREE.MeshStandardMaterial({ color, roughness: 0.72 }));
      const angles = [0.48, 1.52, 2.58, 3.62, 4.66, 5.72];
      angles.forEach((angle, index) => {
        const bed = new THREE.Group();
        const radius = 7.55;
        bed.position.set(Math.sin(angle) * radius, 0, -Math.cos(angle) * radius);
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.82, 0.24, 10), stoneMat);
        base.position.y = 0.66; bed.add(base);
        const soil = new THREE.Mesh(new THREE.CylinderGeometry(0.59, 0.66, 0.12, 10), soilMat);
        soil.position.y = 0.82; bed.add(soil);
        for (let j = 0; j < 5; j++) {
          const a = (Math.PI * 2 * j / 5) + index * 0.31;
          const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.035, 0.34 + (j % 2) * 0.08, 6), leafMats[j % leafMats.length]);
          stem.position.set(Math.cos(a) * 0.28, 1.02, Math.sin(a) * 0.28);
          stem.rotation.z = Math.cos(a) * 0.25; stem.rotation.x = Math.sin(a) * 0.25;
          bed.add(stem);
          const bloom = new THREE.Group();
          bloom.position.set(Math.cos(a) * 0.28, 1.22 + (j % 2) * 0.04, Math.sin(a) * 0.28);
          const center = new THREE.Mesh(new THREE.SphereGeometry(0.075, 10, 8), new THREE.MeshStandardMaterial({ color: 0xf0bd48, roughness: 0.55 }));
          bloom.add(center);
          for (let k = 0; k < 5; k++) {
            const petal = new THREE.Mesh(new THREE.SphereGeometry(0.095, 8, 6), petalMats[(index + j + k) % petalMats.length]);
            const pa = k * Math.PI * 2 / 5;
            petal.position.set(Math.cos(pa) * 0.105, 0.015, Math.sin(pa) * 0.105);
            petal.scale.set(1.0, 0.72, 1.0);
            bloom.add(petal);
          }
          bed.add(bloom);
          const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 6), leafMats[(j + index) % leafMats.length]);
          leaf.position.set(Math.cos(a + 0.55) * 0.23, 0.94, Math.sin(a + 0.55) * 0.23);
          leaf.scale.set(1.5, 0.45, 0.75); leaf.rotation.y = a;
          bed.add(leaf);
        }
        root.add(bed);
      });
      // 광장 테두리에 작고 둥근 장식 돌을 불규칙하게 배치해 기계적인 원형 느낌을 줄입니다.
      const pebbleMat = new THREE.MeshStandardMaterial({ color: 0xe4d5bd, roughness: 0.95 });
      for (let i = 0; i < 24; i++) {
        const a = i * Math.PI * 2 / 24 + 0.08;
        const pebble = new THREE.Mesh(new THREE.SphereGeometry(0.16 + (i % 3) * 0.025, 8, 6), pebbleMat);
        pebble.position.set(Math.sin(a) * 8.45, 0.59, -Math.cos(a) * 8.45);
        pebble.scale.set(1.35, 0.35, 0.8);
        root.add(pebble);
      }
      scene.add(root);
    }

    function buildClouds() {
      const cloudPositions = [
        [-35, 22, -40], [30, 25, -50], [50, 20, -20], [-50, 23, 10],
        [0, 26, -60], [40, 21, 30], [-40, 24, -55]
      ];
      const cloudMat = new THREE.MeshStandardMaterial({
        color: 0xf8fbff, roughness: 1, transparent: true, opacity: 0.88
      });
      cloudPositions.forEach(([cx, cy, cz]) => {
        const cg = new THREE.Group();
        cg.position.set(cx, cy, cz);
        const puffs = [
          [0, 0, 0, 2.2], [-1.8, 0.3, 0.5, 1.8], [1.6, 0.2, -0.3, 1.9],
          [-0.5, 0.6, -0.8, 1.5], [0.8, 0.5, 0.6, 1.6]
        ];
        puffs.forEach(([px, py, pz, r]) => {
          const puff = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), cloudMat);
          puff.position.set(px, py, pz);
          cg.add(puff);
        });
        cg.scale.set(1.2 + Math.random() * 0.5, 0.6, 1.0 + Math.random() * 0.3);
        scene.add(cg);
        animatedProps.push({ mesh: cg, type: "cloud", baseX: cx, speed: 0.3 + Math.random() * 0.4 });
      });
    }

    function addBuildingHitbox(group, viewId, title, subtitle, icon, heightOffset = 4.6, approachDistance = 4.3) {
      group.userData.buildingViewId = viewId;
      group.traverse(child => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          child.userData.viewId = viewId;
          // 건물의 구조 메시만 명시적으로 길찾기 장애물로 등록합니다.
          // 세부 장식 그룹(navigationIgnore)은 충돌 영역에서 제외합니다.
          if (!hasNavigationIgnoreAncestor(child)) child.userData.navigationObstacle = true;
        }
      });
      scene.add(group);
      interactiveBuildings.push({ group, viewId, title, subtitle, icon, heightOffset, approachDistance });
    }

    function addWindow(g, x, y, z, w, h, rotY, emissiveColor) {
      const frame = new THREE.Mesh(
        new THREE.BoxGeometry(w + 0.15, h + 0.15, 0.08),

      frame.position.set(x, y, z);
      if (rotY) frame.rotation.y = rotY;
      g.add(frame);
      const pane = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, 0.1),
        new THREE.MeshStandardMaterial({
          color: emissiveColor || 0xfef3c7,
          emissive: emissiveColor || 0xe5a94c,
          emissiveIntensity: 0.42,
          transparent: true,
          opacity: 0.9
        })
      );
      pane.position.set(x, y, z);
      if (rotY) pane.rotation.y = rotY;
      g.add(pane);

    function makeFacilityDetailGroup() {
      const group = new THREE.Group();
      group.userData.navigationIgnore = true;
      return group;
    }

    function makeFacilitySignTexture(title, subtitle, palette = {}) {
      const canvas = document.createElement("canvas");
      canvas.width = 512; canvas.height = 176;
      const ctx = canvas.getContext("2d");
      const bg = palette.bg || "#f5f0df";
      const accent = palette.accent || "#547c83";
      const ink = palette.ink || "#3f514c";
      ctx.fillStyle = bg; ctx.fillRect(0, 0, 512, 176);
      ctx.strokeStyle = accent; ctx.lineWidth = 12; ctx.strokeRect(8, 8, 496, 160);
      ctx.fillStyle = accent; ctx.fillRect(20, 20, 10, 136);
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillStyle = ink; ctx.font = "bold 58px 'Noto Sans KR', sans-serif";
      ctx.fillText(title, 270, 73);
      ctx.fillStyle = accent; ctx.font = "bold 23px sans-serif";
      ctx.fillText(subtitle, 270, 128);
      const texture = new THREE.CanvasTexture(canvas);
      texture.encoding = THREE.sRGBEncoding;
      texture.anisotropy = 4;
      return texture;
    }

    function addFacilityPlaque(group, title, subtitle, x, y, z, width, height, palette = {}) {
      const frameMat = new THREE.MeshStandardMaterial({ color: palette.frame || 0x8c6848, roughness: 0.72 });
      const board = new THREE.Mesh(new THREE.BoxGeometry(width, height, 0.17), frameMat);
      board.position.set(x, y, z);
      group.add(board);
      const faceMat = new THREE.MeshStandardMaterial({
        map: makeFacilitySignTexture(title, subtitle, palette), roughness: 0.82,
        metalness: 0.01
      });
      const face = new THREE.Mesh(new THREE.PlaneGeometry(width - 0.16, height - 0.14), faceMat);
      face.position.set(x, y, z + 0.091);
      group.add(face);
      const boltMat = new THREE.MeshStandardMaterial({ color: 0xd9b978, metalness: 0.42, roughness: 0.38 });
      for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
        const bolt = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), boltMat);
        bolt.position.set(x + sx * (width / 2 - 0.09), y + sy * (height / 2 - 0.09), z + 0.105);
        group.add(bolt);
      }
    }

    function addFacilityPlanter(group, x, z, flowerColors = [0xe8a0ad, 0xf2cb6c, 0xf7eee0], scale = 1) {
      const potMat = new THREE.MeshStandardMaterial({ color: 0xb9774d, roughness: 0.88 });
      const soilMat = new THREE.MeshStandardMaterial({ color: 0x6b5139, roughness: 1 });
      const leafMats = [0x5f9959, 0x78b56d, 0x8bc57a].map(color => new THREE.MeshStandardMaterial({ color, roughness: 0.95 }));
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.34 * scale, 0.26 * scale, 0.42 * scale, 10), potMat);
      pot.position.set(x, 0.21 * scale, z); group.add(pot);
      const soil = new THREE.Mesh(new THREE.CylinderGeometry(0.29 * scale, 0.29 * scale, 0.05 * scale, 10), soilMat);
      soil.position.set(x, 0.43 * scale, z); group.add(soil);
      for (let i = 0; i < 3; i++) {
        const angle = i * Math.PI * 2 / 3;
        const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.16 * scale, 8, 6), leafMats[i]);
        leaf.position.set(x + Math.cos(angle) * 0.15 * scale, 0.62 * scale, z + Math.sin(angle) * 0.15 * scale);
        leaf.scale.set(1.25, 0.6, 0.8); group.add(leaf);
        const flower = new THREE.Mesh(new THREE.SphereGeometry(0.12 * scale, 10, 8), new THREE.MeshStandardMaterial({ color: flowerColors[i % flowerColors.length], roughness: 0.7 }));
        flower.position.set(x + Math.cos(angle) * 0.15 * scale, 0.78 * scale, z + Math.sin(angle) * 0.15 * scale);
        group.add(flower);
        const center = new THREE.Mesh(new THREE.SphereGeometry(0.045 * scale, 8, 6), new THREE.MeshStandardMaterial({ color: 0xf4cf68, roughness: 0.58 }));
        center.position.copy(flower.position); center.position.y += 0.02 * scale; group.add(center);
      }
    }

    // 직사각형과 반원통을 따로 겹치지 않고, 위쪽이 온전한 아치형 문을 하나의 메시로 만듭니다.
    function createArchedDoorMesh(width, height, depth, material) {
      const radius = width / 2;
      const shape = new THREE.Shape();
      shape.moveTo(-radius, 0);
      shape.lineTo(-radius, height - radius);
      // 왼쪽 상단에서 오른쪽 상단까지 위쪽 반원을 따라 연결합니다.
      shape.absarc(0, height - radius, radius, Math.PI, 0, true);
      shape.lineTo(radius, 0);
      shape.closePath();
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth,
        bevelEnabled: false,
        curveSegments: 24,
        steps: 1
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function addWoodenCrates(g, x, y, z, count) {
      const crateMat = new THREE.MeshStandardMaterial({ color: 0xa86b38, roughness: 0.85 });
      const crateMat2 = new THREE.MeshStandardMaterial({ color: 0x965b2c, roughness: 0.85 });
      for (let i = 0; i < count; i++) {
        const size = 0.4 + Math.random() * 0.3;
        const crate = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), i % 2 === 0 ? crateMat : crateMat2);
        crate.userData.navigationObstacle = true;
        crate.position.set(
          x + (Math.random() - 0.5) * 0.8,
          size / 2 + (i > 0 ? Math.random() * 0.3 : 0),
          z + (Math.random() - 0.5) * 0.6
        );
        crate.rotation.y = Math.random() * 0.5;
        g.add(crate);
      }
    }

    function buildCharacters() {
      const mat = (color, roughness=0.78, metalness=0.02) =>

      const addMesh = (parent, geometry, material, position, scale, rotation) => {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(position[0], position[1], position[2]);
        if (scale) mesh.scale.set(scale[0], scale[1], scale[2]);
        if (rotation) mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        parent.add(mesh);
        return mesh;
      };
      const addSegment = (parent, a, b, radiusTop, radiusBottom, material, radial=12) => {
        const p1 = new THREE.Vector3(a[0], a[1], a[2]);
        const p2 = new THREE.Vector3(b[0], b[1], b[2]);
        const dir = new THREE.Vector3().subVectors(p2, p1);
        const mesh = new THREE.Mesh(
          new THREE.CylinderGeometry(radiusTop, radiusBottom, dir.length(), radial), material
        );
        mesh.position.copy(p1).add(p2).multiplyScalar(0.5);
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        parent.add(mesh);
        return mesh;
      };

    function buildNatureAndProps() {

        for (let l = 0; l < 3; l++) {

        // 줄기는 고정하고 잎·열매만 한 덩어리로 묶어 바람에 아주 조금 흔들리게 합니다.

      const lampCoords = [

      lampCoords.forEach(([lx, lz]) => {

      const fenceMat = new THREE.MeshStandardMaterial({ color: 0x8c562b, roughness: 0.85 });
      const fenceSections = [
        [-13.5, -9.5, 5, 0.55],

      fenceSections.forEach(([fx, fz, count, ang]) => {

      const flowerColors = [0xe089b4, 0xe6b856, 0xa88fd6, 0xe08493, 0x62ba96, 0xe08282, 0x7ba8db];
      const flowerCoords = [
        [-4.5, -9], [-6, -4], [-7, 1], [-5, 7], [-3, 10], [1, 11],

        [-2, -10], [-8, -8], [-9, 3], [9, -7], [10, 5], [-4, 12],

    // 마을의 생활감을 높이는 가구·우편함·정원·해안 장식입니다.
    // 통행이 필요한 소품만 길찾기 장애물로 등록하고, 낮은 식생/해안 장식은 무시합니다.
    function buildVillageFurnishings() {
      const wood = new THREE.MeshStandardMaterial({ color: 0x98633b, roughness: 0.88 });
      const woodLight = new THREE.MeshStandardMaterial({ color: 0xc28a54, roughness: 0.86 });
      const woodDark = new THREE.MeshStandardMaterial({ color: 0x67432d, roughness: 0.9 });
      const cream = new THREE.MeshStandardMaterial({ color: 0xf5e8ce, roughness: 0.9 });
      const brass = new THREE.MeshStandardMaterial({ color: 0xc89a4d, roughness: 0.42, metalness: 0.28 });
      const leaf = new THREE.MeshStandardMaterial({ color: 0x669d5c, roughness: 0.96 });
      const leafLight = new THREE.MeshStandardMaterial({ color: 0x8ac777, roughness: 0.94 });
      const stone = new THREE.MeshStandardMaterial({ color: 0xb5a58f, roughness: 0.96 });
      const petalPalette = [0xe58ea5, 0xf0c45e, 0xf4eee1, 0xa99cda, 0xe98271];
      const petalMats = petalPalette.map(color => new THREE.MeshStandardMaterial({ color, roughness: 0.76 }));

      const addPart = (parent, geometry, material, position, options = {}) => {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(position[0], position[1], position[2]);
        if (options.rotation) mesh.rotation.set(...options.rotation);
        if (options.scale) mesh.scale.set(...options.scale);
        if (options.obstacle) mesh.userData.navigationObstacle = true;
        mesh.castShadow = options.castShadow !== false;
        mesh.receiveShadow = true;
        parent.add(mesh);
        return mesh;
      };

      // 원목 벤치 두 개: 통행로 가장자리에서 광장을 바라보도록 배치합니다.
      const buildBench = (x, z, rotation) => {
        const bench = new THREE.Group();
        bench.position.set(x, 0.38, z);
        bench.rotation.y = rotation;
        const seatBase = addPart(bench, new THREE.BoxGeometry(1.82, 0.13, 0.48), woodLight, [0, 0.48, 0], { obstacle: true });
        seatBase.position.y = 0.48;
        [-0.15, 0, 0.15].forEach((offset, index) => {
          addPart(bench, new THREE.BoxGeometry(1.78, 0.045, 0.105), index === 1 ? cream : woodLight, [0, 0.56, offset]);
        });
        [-0.72, 0.72].forEach(xSide => {
          [-0.16, 0.16].forEach(zSide => {
            addPart(bench, new THREE.BoxGeometry(0.12, 0.55, 0.12), woodDark, [xSide, 0.25, zSide]);
          });
          addPart(bench, new THREE.BoxGeometry(0.12, 0.66, 0.13), wood, [xSide, 0.76, -0.22]);
          addPart(bench, new THREE.BoxGeometry(0.16, 0.12, 0.56), wood, [xSide, 0.82, 0]);
        });
        addPart(bench, new THREE.BoxGeometry(1.78, 0.12, 0.16), woodLight, [0, 0.91, -0.24], { obstacle: true });
        addPart(bench, new THREE.BoxGeometry(1.78, 0.12, 0.16), wood, [0, 1.17, -0.24]);
        // 끝단 금속 장식
        [-0.78, 0.78].forEach(xSide => addPart(bench, new THREE.SphereGeometry(0.055, 8, 6), brass, [xSide, 0.93, -0.325]));
        scene.add(bench);
      };
      buildBench(-5.25, 0.65, Math.PI / 2);
      buildBench(5.25, 0.65, -Math.PI / 2);

      // 작은 우편함: 의뢰를 전달하는 마을이라는 설정을 환경 소품으로 보여줍니다.
      const buildMailbox = (x, z, rotation, color) => {
        const boxMat = new THREE.MeshStandardMaterial({ color, roughness: 0.72 });
        const mailbox = new THREE.Group();
        mailbox.position.set(x, 0.34, z);
        mailbox.rotation.y = rotation;
        addPart(mailbox, new THREE.CylinderGeometry(0.07, 0.09, 1.12, 10), woodDark, [0, 0.56, 0]);
        addPart(mailbox, new THREE.BoxGeometry(0.62, 0.66, 0.46), boxMat, [0, 1.28, 0], { obstacle: true });
        addPart(mailbox, new THREE.BoxGeometry(0.68, 0.12, 0.51), woodDark, [0, 1.66, 0]);
        addPart(mailbox, new THREE.BoxGeometry(0.34, 0.055, 0.035), brass, [0, 1.35, 0.238]);
        addPart(mailbox, new THREE.BoxGeometry(0.20, 0.045, 0.035), cream, [0, 1.48, 0.24]);
        // 우편 도착 깃발
        addPart(mailbox, new THREE.CylinderGeometry(0.025, 0.025, 0.48, 7), brass, [0.34, 1.58, -0.02], { rotation: [0, 0, -0.25] });
        addPart(mailbox, new THREE.BoxGeometry(0.24, 0.13, 0.045), new THREE.MeshStandardMaterial({ color: 0xd76c58, roughness: 0.7 }), [0.40, 1.77, -0.02], { rotation: [0, 0, -0.12] });
        scene.add(mailbox);
      };
      [
        [4.55, -10.65, 0.15, 0x6f91b5],
        [-13.25, -6.7, -0.2, 0xc47a62],
        [-13.15, 5.7, 0.12, 0x7b9e79],
        [13.35, -6.7, -0.15, 0xd3a15a],
        [14.35, 2.8, 0.18, 0x8d83b2],
        [6.35, 12.35, -0.2, 0x6f91b5]
      ].forEach(args => buildMailbox(...args));

      // 마을 게시판: 안내문과 작은 공지 메모가 있는 생활형 랜드마크.
      const notice = new THREE.Group();
      notice.position.set(-5.7, 0.36, 10.6);
      notice.rotation.y = 0.18;
      addPart(notice, new THREE.BoxGeometry(0.16, 1.9, 0.16), woodDark, [-0.72, 0.95, 0]);
      addPart(notice, new THREE.BoxGeometry(0.16, 1.9, 0.16), woodDark, [0.72, 0.95, 0]);
      addPart(notice, new THREE.BoxGeometry(1.72, 1.18, 0.16), wood, [0, 1.72, 0], { obstacle: true });
      addPart(notice, new THREE.BoxGeometry(1.88, 0.12, 0.22), woodLight, [0, 2.34, 0]);
      addPart(notice, new THREE.BoxGeometry(1.88, 0.12, 0.22), woodLight, [0, 1.10, 0]);
      const noticeCanvas = document.createElement("canvas");
      noticeCanvas.width = 512; noticeCanvas.height = 320;
      const nctx = noticeCanvas.getContext("2d");
      nctx.fillStyle = "#f7edda"; nctx.fillRect(0, 0, 512, 320);
      nctx.strokeStyle = "#bf9a69"; nctx.lineWidth = 12; nctx.strokeRect(8, 8, 496, 304);
      nctx.fillStyle = "#5e704d"; nctx.textAlign = "center"; nctx.textBaseline = "middle";
      nctx.font = "bold 54px sans-serif"; nctx.fillText("마을 소식판", 256, 92);
      nctx.fillStyle = "#936b45"; nctx.font = "bold 27px sans-serif";
      nctx.fillText("RED TEAM ISLAND", 256, 153);
      nctx.fillStyle = "#b66d47"; nctx.font = "24px sans-serif";
      nctx.fillText("오늘도 안전한 하루!", 256, 230);
      const noticeTex = new THREE.CanvasTexture(noticeCanvas);
      noticeTex.encoding = THREE.sRGBEncoding;
      const noticeFace = addPart(notice, new THREE.PlaneGeometry(1.52, 0.98), new THREE.MeshStandardMaterial({ map: noticeTex, roughness: 0.88 }), [0, 1.72, 0.091]);
      scene.add(notice);

      // 해안 주변의 둥근 바위와 낮은 이끼 덩어리로 섬의 가장자리를 풍성하게 합니다.
      const coast = new THREE.Group();
      coast.userData.navigationIgnore = true;
      const rockMats = [stone, new THREE.MeshStandardMaterial({ color: 0x9e9a8b, roughness: 0.98 }), new THREE.MeshStandardMaterial({ color: 0xc4b59d, roughness: 0.96 })];
      const rockSpots = [
        [-18.0, -11.5], [-18.2, -8.5], [-18.1, -2.8], [-18.0, 5.8],
        [-13.8, 17.0], [-10.8, 18.0], [-4.0, 18.1], [4.0, 18.0], [10.5, 17.2],
        [18.0, 10.5], [18.1, 6.0], [18.0, -1.0], [18.0, -8.0],
        [12.0, -16.0], [8.5, -18.0], [-7.5, -18.0], [-12.5, -16.5]
      ];
      rockSpots.forEach(([x, z], index) => {
        const cluster = new THREE.Group();
        cluster.position.set(x, 0.16, z);
        const count = 2 + (index % 2);
        for (let r = 0; r < count; r++) {
          const rock = addPart(cluster, new THREE.DodecahedronGeometry(0.55 + (r % 2) * 0.22, 0), rockMats[(index + r) % rockMats.length], [((r % 3) - 1) * 0.42, 0.20 + (r % 2) * 0.10, (r - 1) * 0.18], { scale: [1.25, 0.72, 0.92] });
          rock.rotation.set(0.10 * r, 0.37 * (index + r), 0.08 * (r - 1));
        }
        // 바위 아래의 이끼
        addPart(cluster, new THREE.SphereGeometry(0.58, 8, 6), leaf, [0, 0.10, 0], { scale: [1.45, 0.18, 1.05], castShadow: false });
        coast.add(cluster);
      });
      scene.add(coast);

      // 건물 주변 빈 공간에 꽃과 둥근 관목을 추가해 녹지 밀도를 자연스럽게 조절합니다.
      const gardenSpots = [
        [-14.0, -12.8], [-14.2, 10.7], [-9.0, 14.0], [3.8, 15.0],
        [11.8, 13.2], [15.0, 9.7], [15.0, -11.0], [-10.5, -15.2]

      gardenSpots.forEach(([x, z], index) => {

        for (let b = 0; b < 3; b++) {
          const shrub = addPart(garden, new THREE.SphereGeometry(0.38, 10, 8), b % 2 ? leafLight : leaf, [((b % 2) - 0.5) * 0.55, 0.28 + (b % 2) * 0.06, (b - 1) * 0.26], { scale: [1.0, 0.78, 0.92] });
